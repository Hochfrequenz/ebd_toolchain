name: Publish Docker image to Github Container Registry GHCR
on:
  release:
    types:
      - created

# GITHUB_TOKEN needs write access to packages to push to GHCR; this replaces the former (expiring) personal access token
permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        # with: # we don't need this
        #  submodules: "recursive"
      - name: get version tag
        run: |
          VERSION=$(echo ${GITHUB_REF#refs/tags/})
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Build and push
        run: |
          docker build -t ebd_toolchain:$VERSION .
          docker tag ebd_toolchain:$VERSION ghcr.io/hochfrequenz/ebd_toolchain:$VERSION
          docker push ghcr.io/hochfrequenz/ebd_toolchain:$VERSION
