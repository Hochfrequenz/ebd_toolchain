name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  black:
    # matrix values and job name are kept as "black"/"isort" on purpose, to preserve the
    # existing required-status-check names even though both now run via ruff under the hood.
    # Renaming them requires updating the branch protection required-check list in the same change.
    name: "black (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: black
            command: "ruff format --check ."
          - tool: isort
            command: "ruff check --select I ."
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.14
      - name: Install dependencies
        run: uv sync --locked --group linting
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          uv run ${{ matrix.command }}
