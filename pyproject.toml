[project]
name = "ebd-toolchain"
description = "Combines the features of ebdamame and rebdhuhn to automatically generate SVGs from EBD.docx files"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["EBD", "rebdhuhn", "ebdamame", "scraping", "python-docx", "kroki", "entscheidungsbaumdiagramm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ebdamame>=1.0.1",
    "rebdhuhn>=1.2.1",
    "click",
    "pydantic-settings",
    "fundamend[sqlmodels]>=0.37.0",
    "py7zr",
    # add all the dependencies here
]
dynamic = ["readme", "version"]

[dependency-groups]
tests = ["pytest==9.1.1"]
linting = [
    "ruff==0.16.4",
    {include-group = "tests"},
]
type_check = ["mypy==2.3.1", "types-requests", {include-group = "tests"}]
spell_check = ["codespell==2.4.3"]
coverage = ["coverage==7.15.4", {include-group = "tests"}]
dev = [
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "coverage"},
    {include-group = "spell_check"},
    "pre-commit",
]

[tool.uv]
default-groups = []

[project.urls]
Changelog = "https://github.com/Hochfrequenz/ebd_toolchain/releases"
Homepage = "https://github.com/Hochfrequenz/ebd_toolchain"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[project.scripts]
scrape_and_plot = "ebd_toolchain.main:main"
# `package.model:func` syntax:
# 1. `ebd_toolchain` is the package in the src directory
# 2. `.main` means the main.py module inside the ebd_toolchain package
# 3. `:main` means the main(...) function inside the main.py module

[build-system]
requires = ["hatchling>=1.31.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_ebd_toolchain_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
